# Drives both the Notion -> GitHub sync routing (scripts/sync_notion.py) and
# the docsify sidebar generation (scripts/generate_sidebar.py). One section
# per document type.
#
# Sync fields:
#   root                    - folder under the repo root this type is synced into
#   type                    - value written to each doc's frontmatter `type` field
#   notion_data_source_env  - env var holding the Notion data source ID to sync from
#   group_by                - Notion property (lowercased) used to pick a path/label template
#   frontmatter_properties  - Notion properties (lowercased) copied into each doc's frontmatter
#   path_templates          - map of group_by value -> folder-name template
#   default_path_template   - fallback folder-name template when the value has no entry
#                             above (omit/null to make an unrecognized value an error)
#
# Sidebar fields:
#   label                   - top-level sidebar heading
#   group_label_templates   - map of group_by value -> sidebar group label template
#   default_group_label_template - fallback sidebar group label template
#
# Templates can reference any frontmatter field, e.g. "{area}", plus the
# special `{value}` placeholder for the raw group_by value itself.
#
# site_base_url is the live docsify site's origin, used to build each doc's
# `docsify_url` frontmatter field (hash-routed to that doc's README).
site_base_url: "https://architecture-demo.g-c.dev"

sections:
  - key: adr
    root: ADR
    label: ADRs
    type: ADR
    notion_data_source_env: ADR_DATA_SOURCE_ID
    group_by: scope
    frontmatter_properties: [scope, area, component]
    path_templates:
      Global: "global"
      Area: "{area}"
      Component: "{component}"
    group_label_templates:
      Global: "Global"
      Area: "Area: {area}"
      Component: "Component: {component}"
    default_group_label_template: "Other"

  - key: design-doc
    root: design-docs
    label: Design Docs
    type: "Design Doc"
    notion_data_source_env: DESIGN_DOC_DATA_SOURCE_ID
    group_by: area
    frontmatter_properties: [area]
    default_path_template: "{value}"
    default_group_label_template: "Area: {value}"
