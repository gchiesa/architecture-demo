<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Architecture Demo Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Engineering docs synced from Notion">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #42b883;
      --base-font-size: 16px;
      --content-max-width: 60em;
    }
    body { -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Architecture Demo Docs',
      repo: 'gchiesa/architecture-demo',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      coverpage: false,
      search: {
        placeholder: 'Search docs',
        noData: 'No results',
        depth: 4,
      },
      mermaid: {
        theme: 'default',
      },
      plugins: [
        function stripFrontmatter(hook) {
          hook.beforeEach(function (markdown) {
            return markdown.replace(/^---\n[\s\S]*?\n---\n/, '');
          });
        },
      ],
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Mermaid diagram support -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
