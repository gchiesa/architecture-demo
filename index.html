<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Architecture Demo Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Engineering docs synced from Notion">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism.css">
  <style>
    :root {
      --theme-color: #42b883;
      --base-font-size: 16px;
      --content-max-width: 60em;
    }
    body { -webkit-font-smoothing: antialiased; }
    .notion-edit-link {
      text-align: left;
      margin: 0 0 1.5em 0;
    }
    .notion-edit-link a {
      display: inline-block;
      font-size: 0.8em;
      padding: 0.25em 0.75em;
      border: 1px solid var(--theme-color, #42b883);
      border-radius: 1em;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Architecture Demo Docs',
      repo: 'gchiesa/architecture-demo',
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      coverpage: false,
      search: {
        placeholder: 'Search docs',
        noData: 'No results',
        depth: 4,
      },
      mermaid: {
        theme: 'default',
      },
      plugins: [
        function frontmatterAndNotionEditLink(hook) {
          let notionUrl = null;
          hook.beforeEach(function (markdown) {
            const match = markdown.match(/^---\n([\s\S]*?)\n---\n/);
            notionUrl = null;
            if (match) {
              const urlMatch = match[1].match(/^notion_url:\s*"([^"]*)"/m);
              if (urlMatch) notionUrl = urlMatch[1];
            }
            return markdown.replace(/^---\n[\s\S]*?\n---\n/, '');
          });
          hook.afterEach(function (html) {
            if (!notionUrl) return html;
            return (
              `<p class="notion-edit-link"><a href="${notionUrl}" target="_blank" rel="noopener">✏️ Edit in Notion</a></p>` +
              html
            );
          });
        },
      ],
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1/dist/docsify-sidebar-collapse.min.js"></script>

  <!-- Syntax highlighting for code blocks -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>

  <!-- Mermaid diagram support -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
