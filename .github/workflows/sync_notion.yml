name: Sync Notion Articles to GitHub

on:
  schedule:
    # Runs every day at midnight (adjust cron syntax as needed)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows running manually anytime from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Notion to Markdown
        uses: victornpb/notion-jam@v0.0.13
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
          NOTION_DATABASE: ${{ secrets.NOTION_DATABASE }}
          FILTER_PROP: Sync
          FILTER_VALUES: Ready to Sync
          ARTICLE_PATH: "articles/{title}/README.md"
          ASSETS_PATH: "articles/{title}/images"
          PARALLEL_PAGES: 3
          PARALLEL_DOWNLOADS_PER_PAGE: 3

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No new changes to commit"
          else
            git commit -m "Auto-sync articles from Notion"
            git push
          fi