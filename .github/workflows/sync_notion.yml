name: Sync Notion Articles to GitHub

on:
  schedule:
    # Runs every day at midnight (adjust cron syntax as needed)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows running manually anytime from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Sync Notion to Markdown (ADR + Design Doc + PRD)
        env:
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
          ADR_DATA_SOURCE_ID: ${{ secrets.ADR_DATA_SOURCE_ID }}
          DESIGN_DOC_DATA_SOURCE_ID: ${{ secrets.DESIGN_DOC_DATA_SOURCE_ID }}
          PRD_DATA_SOURCE_ID: ${{ secrets.PRD_DATA_SOURCE_ID }}
        run: mise run sync-notion

      - name: Generate docsify sidebar
        run: mise run gen-sidebar

      # main is protected (no direct pushes) - open a PR with the synced
      # changes instead. It still needs an approval from an identity other
      # than the PR author (github-actions[bot] here), since GitHub blocks
      # self-approval - see the Approve PR step below.
      - name: Open PR with synced changes
        id: open_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No new changes to commit"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automated/sync-notion-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$branch"
          git commit -m "Auto-sync articles from Notion"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Auto-sync articles from Notion" \
            --body "Automated content sync from Notion. No manual content changes - approved and merged automatically."
          number=$(gh pr list --head "$branch" --json number -q '.[0].number')
          echo "pr_number=$number" >> "$GITHUB_OUTPUT"

      # Today: a PAT belonging to the repo admin, used only to approve -
      # never to push code directly. In an org, swap this for a dedicated
      # GitHub App installation token (e.g. actions/create-github-app-token)
      # by changing only the GH_TOKEN value below; nothing else changes.
      - name: Approve PR
        if: steps.open_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.PR_APPROVER_TOKEN }}
        run: gh pr review ${{ steps.open_pr.outputs.pr_number }} --approve --body "Automated approval - routine Notion content sync."

      - name: Merge PR
        if: steps.open_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.open_pr.outputs.pr_number }} --merge --delete-branch
