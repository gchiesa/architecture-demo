name: Sync Notion Articles to GitHub

on:
  schedule:
    # Runs every day at midnight (adjust cron syntax as needed)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows running manually anytime from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Sync Notion to Markdown (ADR + Design Doc)
        env:
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
          ADR_DATABASE_ID: ${{ secrets.ADR_DATABASE_ID }}
          DESIGN_DOC_DATABASE_ID: ${{ secrets.DESIGN_DOC_DATABASE_ID }}
        run: mise run sync-notion

      - name: Generate docsify sidebar
        run: mise run gen-sidebar

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No new changes to commit"
          else
            git commit -m "Auto-sync articles from Notion"
            git push
          fi
