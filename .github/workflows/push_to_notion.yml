name: Push GitHub Edits Back to Notion

on:
  push:
    branches: [main]
    paths:
      - "ADR/**/README.md"
      - "design-docs/**/README.md"
      - "PRD/**/README.md"
  workflow_dispatch:
    inputs:
      files:
        description: "Newline-separated README.md paths to (re)push, e.g. to retry a run that failed before reaching Notion"
        required: true

jobs:
  push-back:
    # Skip commits made by the Notion -> GitHub sync bot itself, otherwise
    # every pull from Notion immediately triggers a push right back to it.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Find changed docs
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files="${{ inputs.files }}"
          else
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'ADR/**/README.md' 'design-docs/**/README.md' 'PRD/**/README.md')
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Push changed docs to Notion
        if: steps.changed.outputs.files != ''
        env:
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
        run: mise run push-to-notion -- ${{ steps.changed.outputs.files }}

      # main is protected (no direct pushes) - open a PR for the metadata
      # update instead, same pattern as sync_notion.yml's write-back.
      - name: Open PR with sync metadata
        id: open_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No metadata changes to commit"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automated/push-to-notion-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$branch"
          git commit -m "Record Notion push-back sync state"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Record Notion push-back sync state" \
            --body "Automated sync metadata update (content_hash / last_edited_time) - approved and merged automatically."
          number=$(gh pr list --head "$branch" --json number -q '.[0].number')
          echo "pr_number=$number" >> "$GITHUB_OUTPUT"

      - name: Approve PR
        if: steps.open_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.PR_APPROVER_TOKEN }}
        run: gh pr review ${{ steps.open_pr.outputs.pr_number }} --approve --body "Automated approval - routine sync metadata update."

      - name: Merge PR
        if: steps.open_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.open_pr.outputs.pr_number }} --merge --delete-branch
